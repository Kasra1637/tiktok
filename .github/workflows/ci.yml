# CI: every pull request and every push to main that touches the backend
# (or this workflow) must pass the backend suite before it merges or
# deploys. Frontend-only pushes skip it: they burn no pytest minutes.
#
#   backend pytest  — `python -m pytest backend/ -q -p no:cacheprovider`
#
# The frontend gates (imports, logic, render smoke, tour audit) no longer run
# here; they stay available locally via frontend/package.json scripts.
#
# Nothing here touches local dev speed: no pre-commit hooks, no husky, no
# local watchers added. This job runs only in GitHub Actions; locally you
# keep running the backend suite by hand.
#
# The deploy workflow stays push-to-main-only and serialized; CI is
# cancel-in-progress so a rapid push series only gates its latest commit.
name: ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The backend suite encodes and probes real clips (mp4 samples,
      # recovery/R2 fixtures, trim tests), so it needs a real ffmpeg
      # on PATH. Without it the run fails with FileNotFoundError /
      # RuntimeError before any product code is exercised.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Backend test suite
        run: python -m pytest backend/ -q -p no:cacheprovider

