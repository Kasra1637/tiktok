services:
  - type: web
    name: tiktok-hookforge
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: hookforge
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: PORT
        value: "8080"
