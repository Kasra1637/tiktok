services:
  - type: web
    name: tiktok-hookforge
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: PORT
        value: "8080"
      - key: CLERK_JWKS_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: MODAL_FRAME_EXTRACTOR_URL
        sync: false
      - key: MODAL_SHARED_SECRET
        sync: false
