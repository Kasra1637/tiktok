# Cloud Build pipeline: HookForge -> Cloud Run
#
# Builds the root Dockerfile (frontend CRA build + Python runtime in one image),
# then pushes it to Artifact Registry so Cloud Run can deploy it.
#
# The Clerk publishable key is pulled from Secret Manager via `availableSecrets`
# and passed as a --build-arg, because CRA inlines process.env.REACT_APP_* at
# BUILD time (see Dockerfile ARG REACT_APP_CLERK_PUBLISHABLE_KEY). It cannot be
# supplied at runtime: a build without it produces a bundle with auth disabled,
# which looks like a blank page rather than a config error.
#
# Reading it from Secret Manager rather than a trigger substitution keeps the key
# out of build logs and out of the trigger configuration in the console.
#
# $PROJECT_ID and $COMMIT_SHA are built-in Cloud Build substitutions, so this
# file works in any project without hardcoding a project ID.

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/hookforge/hookforge:$COMMIT_SHA
      # The value arrives as an env var from availableSecrets below. Using it as
      # a build-arg (rather than a plain substitution) keeps it out of the
      # trigger's configuration UI and out of `gcloud builds submit` echoes.
      - --build-arg
      - REACT_APP_CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/hookforge/hookforge:$COMMIT_SHA

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/hookforge/hookforge:$COMMIT_SHA

# The build installs ffmpeg via apt, pip installs requirements plus yt-dlp, and
# runs a full yarn production build. That comfortably exceeds Cloud Build's 10
# minute default on a cold cache, so give it room.
timeout: 1800s

# Runtime secrets for Cloud Run are referenced when the service is created in
# the console; only the build-time key is needed here.
#
# The project ID is written out rather than referenced as $PROJECT_ID on
# purpose. If this path fails to resolve, Cloud Build drops the whole secret
# binding and then fails with a misleading message about
# "CLERK_PUBLISHABLE_KEY is not a valid built-in substitution" -- it reports the
# symptom at line 31, not the cause here. Spelling the project out means a wrong
# guess fails at this line with a message that names Secret Manager.
availableSecrets:
  secretManager:
    - versionName: projects/hookforge-prod/secrets/CLERK_PUBLISHABLE_KEY/versions/latest
      env: CLERK_PUBLISHABLE_KEY

substitutions:
  # Must match the Artifact Registry repository region. A mismatch fails the
  # push with a confusing cross-registry error.
  _REGION: us-west1

# Logs go to Cloud Logging only, with nothing archived to a GCS bucket.
#
# This is required, not an optimization. The project's default logs bucket is
# owned by the default compute service account, so a build that runs as the
# user-managed `hookforge-build` account cannot write to it. Cloud Build rejects
# any build that names a service account without a logs bucket, a regional
# user-owned bucket, or explicit CLOUD_LOGGING_ONLY/NONE logging.
#
# Nothing is lost: build logs remain visible in the console and via
# `gcloud builds log`.
options:
  logging: CLOUD_LOGGING_ONLY