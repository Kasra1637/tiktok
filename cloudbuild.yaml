# Cloud Build pipeline: HookForge -> Cloud Run
#
# Builds the root Dockerfile (frontend CRA build + Python runtime in one image),
# pushes it to Artifact Registry, then deploys that exact image to the
# hookforge Cloud Run service. Every push to main therefore ends live: no
# manual deploy step exists anywhere else, so nothing here may be removed
# without replacing it.
#
# The Clerk publishable key is a BUILD-time input, not a runtime one: CRA inlines
# process.env.REACT_APP_* into the bundle when it compiles, so the key has to be
# present during `yarn build` (see the ARG in Dockerfile) and cannot be supplied
# when the container starts.
#
# It is passed as a plain substitution rather than through Secret Manager,
# because a Clerk *publishable* key (pk_live_/pk_test_) is public by design --
# Clerk ships it to every browser that loads the app, so anyone can read it from
# the served bundle regardless of where the build gets it from. Secret Manager
# would have implied protection that does not exist for this value, and cost
# three failed builds learning that the binding did not resolve.
#
# The actual key value lives in the private env files below, not in this file.
# `verify-build-key` fails the build outright if it was ever overwritten with the
# placeholder, which is deliberate: an empty key does NOT fail the build, it
# produces a bundle with sign-in silently disabled and a blank page (see
# frontend/src/lib/clerk.js). Failing loudly is the only safe default.

steps:
  # Cheap guard, runs in ~2s, and fails before the multi-minute image build
  # rather than after it.
  - id: verify-build-key
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ -z "${_CLERK_PUBLISHABLE_KEY}" ] || \
           [ "${_CLERK_PUBLISHABLE_KEY}" = "PASTE_CLERK_PUBLISHABLE_KEY_HERE" ]; then
          echo "ERROR: _CLERK_PUBLISHABLE_KEY is unset or still the placeholder."
          echo "The frontend would build with authentication silently disabled."
          exit 1
        fi
        echo "Clerk publishable key present (${#_CLERK_PUBLISHABLE_KEY} chars, value not logged)."

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/hookforge/hookforge:$COMMIT_SHA
      - --build-arg
      - REACT_APP_CLERK_PUBLISHABLE_KEY=${_CLERK_PUBLISHABLE_KEY}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/hookforge/hookforge:$COMMIT_SHA

  # Deploy the image this build just pushed. Image-only on purpose: no
  # --set-env-vars / --set-secrets / --update-* flag is passed, so the new
  # revision keeps every existing setting (plain env vars, all six secret
  # refs, concurrency, scaling, probes) and only swaps the container image.
  # A partial --set-secrets would silently drop the refs it does not name
  # while still deploying green (see service.yaml) -- that flag must never
  # be added here without passing all six.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    # The slim image boots into bash, not gcloud: without this the args below
    # run as `bash run deploy ...` and the step dies with `"run": executable
    # file not found` after a successful build+push (exactly the d323079
    # failure). The verify step above states `entrypoint: bash` for the same
    # reason, in reverse.
    entrypoint: gcloud
    args:
      - run
      - deploy
      - hookforge
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/hookforge/hookforge:$COMMIT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/hookforge/hookforge:$COMMIT_SHA

# The build installs ffmpeg via apt, pip installs requirements plus yt-dlp, and
# runs a full yarn production build. That comfortably exceeds Cloud Build's 10
# minute default on a cold cache, so give it room.
timeout: 1800s

# Logs go to Cloud Logging only, with nothing archived to a GCS bucket.
#
# This is required, not an optimization. The project's default logs bucket is
# owned by the default compute service account, so a build that runs as the
# user-managed `hookforge-build` account cannot write to it. Cloud Build rejects
# any build that names a service account without a logs bucket, a regional
# user-owned bucket, or explicit CLOUD_LOGGING_ONLY/NONE logging.
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  # Must match the Artifact Registry repository region. A mismatch fails the
  # push with a confusing cross-registry error.
  _REGION: us-west1

  # Clerk publishable key (pk_live_... or pk_test_...), from
  # Render's REACT_APP_CLERK_PUBLISHABLE_KEY or dashboard.clerk.com -> API Keys.
  # Public by design -- see the header comment.
  _CLERK_PUBLISHABLE_KEY: "pk_test_a25vd24tbWF5Zmx5LTQ4LmNsZXJrLmFjY291bnRzLmRldiQ"